<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>学习搭档 · Study Mate</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/vendor/katex.min.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <nav class="activity" aria-label="主导航">
      <div class="activity-top">
        <button class="act active" data-go="#/" title="工作台" aria-label="工作台">
          <svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z" /></svg>
        </button>
        <button class="act" data-go="#/s/" title="科目" aria-label="科目">
          <svg viewBox="0 0 24 24"><path d="M5 4.6c2.4-.8 4.6-.4 7 1 2.4-1.4 4.6-1.8 7-1v14c-2.4-.8-4.6-.4-7 1-2.4-1.4-4.6-1.8-7-1z" /><path d="M12 5.6v14" /></svg>
        </button>
        <button class="act" data-go="#/memory" title="记忆" aria-label="记忆">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" /><path d="M12 7.5V12l3 2" /></svg>
        </button>
      </div>
      <div class="activity-bottom">
        <button class="act" id="themeBtn" title="切换主题" aria-label="切换主题">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5" /><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4" /></svg>
        </button>
        <div class="avatar" title="学习者">学</div>
      </div>
    </nav>

    <aside class="explorer" id="explorer">
      <div class="explorer-head">
        <div class="brand">
          <span class="brand-mark">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <rect x="2" y="2" width="60" height="60" rx="14" fill="currentColor" />
              <path d="M13 19c7-2.4 13-1.2 19 2.2 6-3.4 12-4.6 19-2.2v27c-7-2.4-13-1.2-19 2.2-6-3.4-12-4.6-19-2.2V19z" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round" />
              <path d="M32 21.2v27" stroke="#fff" stroke-width="2.6" stroke-linecap="round" />
              <circle cx="46" cy="17" r="4" fill="#E9B44C" />
            </svg>
          </span>
          <span class="brand-name">StudyMate</span>
          <span class="brand-sub" id="workspaceName">学习搭档</span>
        </div>
      </div>

      <div class="explorer-body">
        <div class="tree-title">
          <span>工作区</span>
          <span class="tree-actions">
            <button class="mini" id="refreshBtn" title="刷新">↻</button>
          </span>
        </div>
        <div class="tree" id="tree"></div>
      </div>

      <div class="explorer-foot" id="workspacePath"></div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div class="crumb" id="crumb"></div>
        <div class="topbar-actions">
          <span class="hint" id="topHint"></span>
          <button class="mini-btn" id="refreshTop" title="刷新数据">刷新</button>
          <button class="mini-btn" id="themeTop" title="切换主题">主题</button>
        </div>
      </header>

      <div class="workspace-body">
        <main class="content" id="content">
          <div class="content-inner" id="stageInner"><div class="loading">正在读取学习工作区…</div></div>
        </main>
        <aside class="sidepanel" id="sidePanel" hidden></aside>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/katex.min.js"></script>
  <script src="/vendor/auto-render.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
